<script>
        // Simple toggle logic for demonstration
        const btnExpense = document.getElementById('btn-expense');
        const btnBalance = document.getElementById('btn-balance');

        function setToggleState(activeBtn, inactiveBtn) {
            activeBtn.classList.add('bg-white', 'text-primary', 'shadow-sm');
            activeBtn.classList.remove('text-on-surface-variant');
            
            inactiveBtn.classList.remove('bg-white', 'text-primary', 'shadow-sm');
            inactiveBtn.classList.add('text-on-surface-variant');
        }

        btnExpense.addEventListener('click', () => setToggleState(btnExpense, btnBalance));
        btnBalance.addEventListener('click', () => setToggleState(btnBalance, btnExpense));
        
        // Auto-format currency (basic)
        const amountInput = document.getElementById('amount-input');
        amountInput.addEventListener('input', function(e) {
            // Replace non-numeric chars for basic UX (in real app, use proper formatter)
            this.value = this.value.replace(/[^0-9.,]/g, '');
        });
