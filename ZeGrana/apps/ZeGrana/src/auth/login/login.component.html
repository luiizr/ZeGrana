<div class="auth-root">
    <p-card class="auth-card">
        <ng-template pTemplate="header">
            <h2 class="title">ZeGrana</h2>
            <p class="subtitle">Gerencie seu dinheiro com clareza</p>
        </ng-template>

        <form (ngSubmit)="onSubmit()" class="form">
            <label for="email" class="p-mb-2">E-mail</label>
            <input id="email" pInputText type="email" [(ngModel)]="email" name="email" placeholder="seu@exemplo.com" />

            <label for="password" class="p-mt-3 p-mb-2">Senha</label>
            <p-password id="password" [(ngModel)]="password" name="password" feedback="false" promptLabel="Digite a senha"></p-password>

            <button pButton type="submit" class="p-mt-4 p-button-rounded p-button-primary">Entrar</button>
        </form>

        <ng-template pTemplate="footer">
            <div class="footer">
                <a routerLink="/register" class="link">Criar conta</a>
            </div>
        </ng-template>
    </p-card>
</div>
